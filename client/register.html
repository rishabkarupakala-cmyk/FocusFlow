<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="/src/register.css">

</head>

<body>

<div class="register-container">

    <div class="register-card">

        <h1>🚀 FocusFlow</h1>

        <p>Create your account</p>

        <form id="register-form">

            <input
                id="name"
                type="text"
                placeholder="Full Name"
                required
            >

            <input
                id="email"
                type="email"
                placeholder="Email"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <input
                id="confirm-password"
                type="password"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">

                Create Account

            </button>

        </form>

        <p class="login-text">

            Already have an account?

            <a href="login.html">

                Sign In

            </a>

        </p>

    </div>

</div>

<script type="module"
        src="/src/register.ts"></script>

</body>

</html>
